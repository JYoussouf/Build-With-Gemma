<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Site</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { text-align: center; padding: 2rem; }
    h1 { font-size: 3rem; margin-bottom: 1rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { font-size: 1.25rem; color: #94a3b8; margin-bottom: 0.5rem; }
    .badge { display: inline-block; margin-top: 1.5rem; padding: 0.5rem 1.5rem; background: #1e293b; border: 1px solid #334155; border-radius: 9999px; font-size: 0.875rem; color: #64748b; }
    .info { margin-top: 2rem; padding: 1.5rem; background: #1e293b; border-radius: 0.5rem; border: 1px solid #334155; text-align: left; max-width: 480px; margin-left: auto; margin-right: auto; }
    .info h2 { font-size: 1rem; margin-bottom: 0.75rem; color: #cbd5e1; }
    .info code { background: #0f172a; padding: 0.2rem 0.5rem; border-radius: 0.25rem; font-size: 0.875rem; color: #f59e0b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Test Site</h1>
    <p>This is a test deployment on port 8080.</p>
    <span class="badge">No domain required</span>
    <div class="info">
      <h2>Server Info</h2>
      <p>Accessed via: <code>http://45.137.194.227:8080</code></p>
      <p>Port: <code>8080</code></p>
      <p>Status: <code>Running</code></p>
    </div>
  </div>
</body>
</html>
